name: Release mobile

on:
  push:
    tags: ["mobile-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup
        uses: ./tooling/github/setup
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build APK
        run: pnpm --filter @noted/mobile build:apk
      - name: Create release
        run: |
          version="${GITHUB_REF_NAME#mobile-v}"
          apk="apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          dest="noted-mobile-${version}-debug.apk"
          cp "$apk" "$dest"
          gh release create "$GITHUB_REF_NAME" --generate-notes "$dest"
        env:
          GH_TOKEN: ${{ github.token }}
