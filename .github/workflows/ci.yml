name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup
        uses: ./tooling/github/setup
      - name: Copy env
        shell: bash
        run: cp .env.example .env
      - name: Format
        run: pnpm format

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup
        uses: ./tooling/github/setup
      - name: Copy env
        shell: bash
        run: cp .env.example .env
      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup
        uses: ./tooling/github/setup
      - name: Copy env
        shell: bash
        run: cp .env.example .env
      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: noted
          POSTGRES_PASSWORD: noted
          POSTGRES_DB: noted_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noted"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      NOTED_SYNC_TEST_DATABASE_URL: postgresql://noted:noted@localhost:5432/noted_sync_test
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: noted-media
      S3_ACCESS_KEY_ID: noted
      S3_SECRET_ACCESS_KEY: notednoted
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup
        uses: ./tooling/github/setup
      - name: Copy env
        shell: bash
        run: cp .env.example .env
      # Community container images are no longer available. Build the pinned
      # official source release; production continues to use AWS S3.
      - name: Set up Go for test storage
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.8"
          cache: false
      - name: Build test storage
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          mkdir -p "$RUNNER_TEMP/noted-minio/bin"
          # Official RELEASE.2025-10-15T17-29-55Z, pinned to its immutable commit.
          GOBIN="$RUNNER_TEMP/noted-minio/bin" go install github.com/minio/minio@9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
      - name: Start MinIO
        shell: bash
        env:
          MINIO_ROOT_USER: noted
          MINIO_ROOT_PASSWORD: notednoted
        run: |
          "$RUNNER_TEMP/noted-minio/bin/minio" server "$RUNNER_TEMP/noted-minio/data" \
            --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
            > "$RUNNER_TEMP/noted-minio/server.log" 2>&1 &
          for _ in $(seq 1 24); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 5
          done
          curl -sf http://localhost:9000/minio/health/live || { cat "$RUNNER_TEMP/noted-minio/server.log"; exit 1; }
      - name: Test
        run: pnpm test

  synth:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://ci.invalid
    steps:
      - uses: actions/checkout@v5
      - name: Setup
        uses: ./tooling/github/setup
      - name: Copy env
        shell: bash
        run: cp .env.example .env
      - name: Synth
        run: pnpm synth

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup
        uses: ./tooling/github/setup
      - name: Copy env
        shell: bash
        run: cp .env.example .env
      - name: Build
        run: pnpm build
