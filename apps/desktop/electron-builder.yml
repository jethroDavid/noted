appId: com.noted.app
productName: Noted
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - renderer/**
  - "!dist/**/*.test.js"
  - package.json
  - "!node_modules/**"
npmRebuild: false
win:
  target: nsis
  icon: icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
