services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: noted
      POSTGRES_PASSWORD: noted
      POSTGRES_DB: noted
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noted"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
